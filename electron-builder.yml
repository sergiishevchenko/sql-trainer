appId: app.sqlmastery.desktop
productName: SQL Mastery
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!data/*'
extraResources:
  - from: data
    to: data
    filter:
      - '**/*'
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
  - node_modules/hash-wasm/**/*
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Education
  maintainer: SQL Mastery
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
